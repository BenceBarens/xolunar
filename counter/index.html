    <title>XOLunar | Counter</title>
    <meta name="robots" content="noindex,follow">

    <meta property="og:description" content="We are XOLunar, a tight-knit audiovisual studio based in Amsterdam. We partner with musical artists and visionary events to tell compelling stories through sound, motion, and design. In an industry saturated with recycled aesthetics and copied trends, we exist to break the cycle. We deliver refreshing, original audiovisuals that push boundaries, without losing sight of the proven formulas that drive engagement.">

    <link rel="stylesheet" href="../assets/style/counterpage.css">

    <link rel="apple-touch-icon" sizes="180x180" href="https://bencebarens.github.io/xolunar/assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://bencebarens.github.io/xolunar/assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://bencebarens.github.io/xolunar/assets/favicon/favicon-16x16.png">

<body id="counterpage">
    <main id="main">
        <p id="counter-wrapper">
            <span class="counter-text">the work of XOLunar has been seen</span>
            <span id="counter">252.223.087</span>
            <span class="counter-text">times worldwide</span>
        </p>
    </main>

    <button id="fullscreenKnop" type="button">Fullscreen</button>

    <script src="../assets/script/main.js"></script>
    <script>
        const knop = document.getElementById('fullscreenKnop');

        knop.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch((err) => {
                    console.error(`Error opening fullscreen: ${err.message}`);
                });
                knop.innerText = "Exit fullscreen";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                knop.innerText = "Fullscreen";
            }
        });

        startInactivityCheck(
            document.querySelector('body'),
            5000,
            (element) => {
                element.style.cursor = 'none';
                knop.style.opacity = '0'; 
            },
            (element) => {
                element.style.cursor = null;
                knop.style.opacity = '1';
            }
        );

        function startInactivityCheck(element, delay, callbackInactivity, callbackActive) {
            let timeoutId;
            
            setupTimers();

            function setupTimers () {
                element.addEventListener("mousemove", resetTimer, false);
                element.addEventListener("mousedown", resetTimer, false);
                element.addEventListener("keypress", resetTimer, false);
                element.addEventListener("touchmove", resetTimer, false);

                startTimer();
            }

            function startTimer() { 
                timeoutId = setTimeout(() => callbackInactivity(element), delay);
            }

            function resetTimer() {
                callbackActive(element);
                clearTimeout(timeoutId);
                startTimer();
            }
        }
    </script>
</body>
</html>
