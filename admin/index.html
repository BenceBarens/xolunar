<!DOCTYPE html><!-- Website Made by Bence (bencebarens.nl) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bence Barens">

    <title>XOLunar</title>
    <meta name="robots" content="noindex,follow">

    <meta property="og:site_name" content="XOLunar | Admin">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta property="og:url" content="">

    <link rel="stylesheet" href="../assets/style/base.css">
    <style>
        body{ max-width: 40em; margin: auto; margin-top: 2em; }
        label, .file-section span { display: block; padding-top: 1em; padding-bottom: 1em; font-weight: 800; text-align: center;}
        select, input[type="file"], input[type="password"], button { color: var(--color-primary); width: 100%; padding: 0.5em; border-radius: 0.5em; border: 0.1em solid var(--color-secondary); box-sizing: border-box; }
        button { background: #0066cc; color: white; border: none; margin-top: 16px; padding: 0.5em 1em; font-weight: 600; width: fit-content;}
        button:disabled { background: #999; cursor: not-allowed; }
        #status { margin-top: 2em; padding: 1em; border-radius: 0.5em; display: none; }
        .success { background: #e6f4ea; color: #137333; }
        .error { background: #fce8e6; color: #c5221f; }
        
        .file-section, .adding-file { margin-top: 3em; border-top: 0.1em solid var(--color-secondary); }
        .file-list { list-style: none; padding: 0; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5em 0; border-bottom: 0.1em solid var(--color-secondary); }
        .file-item:last-child { border-bottom: none; }
        .file-name { font-family: monospace; word-break: break-all; margin-right: 12px; }
        .btn-delete { margin-top: 0; background: none; border: 0.1em solid var(--color-secondary); }
    </style>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
    <meta name="theme-color" content="#ff0000">
</head>
<body>
    <h1>Media manager</h1>

    <div id="auth-state">
        <label for="token-input">GitHub Personal Access Token</label>
        <input type="password" id="token-input" placeholder="github_pat_..." autocomplete="current-password">
        <button onclick="loginWithToken()" type="button">Login</button>
        <div id="login-status"></div>
    </div>

    <div id="dashboard" style="display: none;">
        <p><a href="#" onclick="logout()">Log out</a></p>

        <label for="folder">Select folder</label>
        <select id="folder" onchange="loadFiles()">
            <option value="assets/media/Photo/cover art">Photo / cover art</option>
            <option value="assets/media/Photo/photo">Photo / photo</option>
            <option value="assets/media/audio/beats">Audio / beats</option>
            <option value="assets/media/audio/instrumentals">Audio / instrumentals</option>
        </select>

        <div class="adding-file">
            <label for="file">Add file to folder</label>
            <input type="file" id="file">
            <p>Note: make sure to only upload .webp in photo folders and .mp4 in audio folders. When uploading images, try to make them 1950px or smaller.</p>
            <button id="upload-btn" onclick="uploadFile()" type="button">Upload file</button>
            <div id="status"></div>
        </div>

        <div class="file-section">
            <span>Remove files from folder</span>
            <ul id="file-list" class="file-list"></ul>
        </div>
    </div>

    <script src="../assets/script/admin.js"></script>
</body>
</html>
