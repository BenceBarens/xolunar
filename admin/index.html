<!DOCTYPE html><!-- Website Made by Bence (bencebarens.nl) -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bence Barens">

    <title>XOLunar</title>
    <meta name="robots" content="noindex,follow">

    <meta property="og:site_name" content="XOLunar | Admin">
    <meta property="og:description" content="">
    <meta property="og:image" content="">
    <meta property="og:url" content="">

    <link rel="stylesheet" href="../assets/style/base.css">
    <style>
        .card { border: 0.1em solid var(--color-secondary); border-radius: 1em; padding: 1em; }
        label { display: block; font-weight: 600; margin-top: 16px; margin-bottom: 6px; }
        select, input[type="file"], button { width: 100%; padding: 10px; border-radius: 6px; border: 0.1em solid var(--color-secondary); }
        button { background: #0066cc; color: white; border: none; font-weight: 600; margin-top: 16px; }
        button:disabled { background: #999; cursor: not-allowed; }
        #status { margin-top: 16px; padding: 10px; border-radius: 6px; display: none; }
        .success { background: #e6f4ea; color: #137333; }
        .error { background: #fce8e6; color: #c5221f; }
        
        .file-section { margin-top: 32px; border-top: 1px solid #eee; padding-top: 20px; }
        .file-list { list-style: none; padding: 0; margin: 12px 0 0 0; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid #f0f0f0; }
        .file-item:last-child { border-bottom: none; }
        .file-name { font-family: monospace; font-size: 0.9em; word-break: break-all; margin-right: 12px; }
        .btn-delete { width: auto; padding: 6px 12px; margin-top: 0; background: #d93025; font-size: 0.85em; }
        .empty-msg { color: #666; font-style: italic; margin-top: 8px; }
    </style>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👁️</text></svg>">
    <meta name="theme-color" content="#ff0000">
</head>
<body>
    <div class="card">
        <h2>Media manager</h2>

        <div id="auth-state">
        <button onclick="netlifyIdentity.open()" type="button">Login</button>
        </div>

        <div id="dashboard" style="display: none;">
        <p>Logged in as <strong id="user-email"></strong> (<a href="#" onclick="netlifyIdentity.logout()">Log out</a>)</p>

        <label for="folder">Select folder</label>
        <select id="folder" onchange="loadFiles()">
            <option value="assets/media/Photo/cover art">Photo / cover art</option>
            <option value="assets/media/Photo/photo">Photo / photo</option>
            <option value="assets/media/audio/beats">Audio / beats</option>
            <option value="assets/media/audio/instrumentals">Audio / instrumentals</option>
        </select>

        <label for="file">Add file</label>
        <input type="file" id="file">

        <button id="upload-btn" onclick="uploadFile()" type="button">Upload file</button>
        <div id="status"></div>

        <div class="file-section">
            <h3>Files in this folder</h3>
            <ul id="file-list" class="file-list"></ul>
        </div>
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('status');
        const uploadBtn = document.getElementById('upload-btn');
        const fileListElement = document.getElementById('file-list');
        const branch = 'main';

        netlifyIdentity.on('init', handleAuth);
        netlifyIdentity.on('login', () => { handleAuth(); netlifyIdentity.close(); });
        netlifyIdentity.on('logout', handleAuth);

        function handleAuth() {
        const user = netlifyIdentity.currentUser();
        if (user) {
            document.getElementById('auth-state').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('user-email').innerText = user.email;
            loadFiles();
        } else {
            document.getElementById('auth-state').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
        }
        }

        async function loadFiles() {
        const user = netlifyIdentity.currentUser();
        if (!user) return;

        const folder = document.getElementById('folder').value;
        fileListElement.innerHTML = '<li>Laden...</li>';

        try {
            const token = await user.jwt();
            const res = await fetch(`/.netlify/git/github/contents/${encodeURIComponent(folder)}?ref=${branch}`, {
            headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 404) {
            fileListElement.innerHTML = '<li class="empty-msg">Folder is empty or non-existent</li>';
            return;
            }

            if (!res.ok) throw new Error("Couldn't fetch files.");

            const data = await res.json();
            const files = Array.isArray(data) ? data.filter(item => item.type === 'file') : [];

            if (files.length === 0) {
            fileListElement.innerHTML = '<li class="empty-msg">No files found in this folder</li>';
            return;
            }

            fileListElement.innerHTML = '';
            files.forEach(file => {
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <span class="file-name">${file.name}</span>
                <button class="btn-delete" onclick="deleteFile('${file.name}', '${file.sha}')">Delete</button>
            `;
            fileListElement.appendChild(li);
            });
        } catch (err) {
            fileListElement.innerHTML = `<li class="empty-msg">Error loading: ${err.message}</li>`;
        }
        }

        async function uploadFile() {
        const user = netlifyIdentity.currentUser();
        const fileInput = document.getElementById('file');
        const folder = document.getElementById('folder').value;

        if (!fileInput.files.length) {
            showStatus('Choose a file', 'error');
            return;
        }

        const file = fileInput.files[0];
        const filePath = `${folder}/${file.name}`;
        
        uploadBtn.disabled = true;
        showStatus('Uploading and committing GitHub...', '');

        try {
            const base64Content = await toBase64(file);
            const token = await user.jwt();

            const res = await fetch(`/.netlify/git/github/contents/${filePath}`, {
            method: 'PUT',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: `CONTENT: uploaded ${file.name} to ${folder}`,
                content: base64Content.split(',')[1],
                branch: branch
            })
            });

            if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.message || 'Error uploading');
            }

            showStatus(`"${file.name}" uploaded successfully.`, 'success');
            fileInput.value = '';
            loadFiles();
        } catch (err) {
            showStatus(`Fout: ${err.message}`, 'error');
        } finally {
            uploadBtn.disabled = false;
        }
        }

        async function deleteFile(fileName, sha) {
        if (!confirm(`Are you sure you want to delete "${fileName}"?`)) return;

        const user = netlifyIdentity.currentUser();
        const folder = document.getElementById('folder').value;
        const filePath = `${folder}/${fileName}`;

        showStatus(`"${fileName}" deleting...`, '');

        try {
            const token = await user.jwt();
            const res = await fetch(`/.netlify/git/github/contents/${filePath}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: `CONTENT: deleted ${fileName} from ${folder}`,
                sha: sha,
                branch: branch
            })
            });

            if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.message || 'Error deleting');
            }

            showStatus(`"${fileName}" deleted successfully`, 'success');
            loadFiles();
        } catch (err) {
            showStatus(`Error deleting ${err.message}`, 'error');
        }
        }

        function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
        }

        function showStatus(msg, type) {
        statusBox.innerText = msg;
        statusBox.className = type;
        statusBox.style.display = msg ? 'block' : 'none';
        }
    </script>
</body>
</html>
